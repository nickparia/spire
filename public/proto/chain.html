<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chain feel test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0608;
        color: #e8dcc8;
        font:
          14px system-ui,
          sans-serif;
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
      }
      canvas {
        display: block;
        margin: 0 auto;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
      }
      #hud b {
        font-size: 28px;
      }
      #btns {
        position: fixed;
        bottom: 34px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      #btns button {
        background: #2a1c17;
        color: #e8dcc8;
        border: 1px solid #5a4634;
        border-radius: 8px;
        padding: 8px 14px;
        font: inherit;
      }
      #keys {
        position: fixed;
        bottom: 10px;
        left: 0;
        right: 0;
        text-align: center;
        opacity: 0.55;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div><b id="n">0</b> slabs</div>
      <div id="r"></div>
    </div>
    <div id="keys">tap: catch · C: claw · S: wall strike · R: restart · ?bot=16 · ?calm</div>
    <div id="btns">
      <button data-k="c">claw</button><button data-k="s">strike</button
      ><button data-k="r">restart</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/planck@1.5.0/dist/planck.min.js"></script>
    <script>
      // ---------------------------------------------------------------------
      // The Descent on a real chain. The drill (a mount at the top) hangs a chain
      // of links; each catch welds a slab to a fresh pair of links at the hook,
      // at the x it was caught, so its weight sits where you put it and tilts
      // everything below. The god hauls back: a true catch drags the drill a step
      // into the rock, a miss lets it be hauled back out. Claws burst from the
      // walls and shove the chain; blows to the rock whip the mount.
      // ---------------------------------------------------------------------
      const { World, Vec2, Box, RevoluteJoint, WeldJoint } = planck;
      const params = new URLSearchParams(location.search);
      const PPM = 60; // px per metre
      const W = 440,
        H = 956;
      const SLAB_W = 120,
        SLAB_H = 24,
        LINK_H = 14,
        LINK_W = 6;
      const SHAFT = 190; // half width of the shaft
      const HOOK = 40; // the two chains hang this far either side of where the slab was caught
      const SNAP = 15; // slab-steps of drag that break through
      const STEP = 36,
        STEP_OFF = 16,
        SUCK_MISS = 34,
        SUCK_IDLE = 3.5;
      const bot = Number(params.get("bot") || 0);
      const calm = params.has("calm"); // no claws or strikes: the bare chain

      const cv = document.getElementById("c");
      const dpr = Math.min(2, devicePixelRatio || 1);
      cv.width = W * dpr;
      cv.height = H * dpr;
      cv.style.width = W + "px";
      cv.style.height = H + "px";
      const ctx = cv.getContext("2d");

      let world,
        mount,
        chain,
        slabs,
        stone,
        drag,
        time,
        over,
        camY,
        claws,
        strikeT,
        clawT,
        log,
        shake,
        drillY,
        fell,
        wallT;
      const m = (px) => px / PPM,
        px = (m) => m * PPM;

      function reset() {
        world = new World({ gravity: Vec2(0, 9.8) });
        mount = world.createBody({ type: "kinematic", position: Vec2(0, 0) });
        mount.createFixture(Box(m(60), m(8)), { density: 1, filterMaskBits: 0 });
        // The shaft walls: real rock the slabs knock against.
        for (const side of [-1, 1]) {
          const wall = world.createBody({
            type: "static",
            position: Vec2(m(side * (SHAFT + 20)), m(400)),
          });
          wall.createFixture(Box(m(20), m(900)), { friction: 0.4 });
        }
        wallT = 0;
        world.on("begin-contact", (c) => {
          const a = c.getFixtureA().getBody(),
            b = c.getFixtureB().getBody();
          if (
            (a.getType() === "static" || b.getType() === "static") &&
            time - wallT > 0.5 &&
            !over
          ) {
            wallT = time;
            drag -= 0.3;
            flash("wall", "#f88");
            shake = 0.5;
          }
        });
        chain = [];
        slabs = [];
        claws = [];
        drag = 2;
        time = 0;
        over = null;
        camY = 250;
        strikeT = 6;
        clawT = 4;
        shake = 0;
        drillY = 0;
        fell = 0;
        stone = { x: -1, dir: 1, speed: 1.05 };
        log = [];
        addSlab(0);
        hud();
      }

      /** A chain of two links hung from `body` at local point `at`; returns the lower link. */
      function addLinks(body, at) {
        let prev = body,
          anchor = body.getWorldPoint(at);
        for (let i = 0; i < 2; i++) {
          const link = world.createBody({
            type: "dynamic",
            position: Vec2(anchor.x, anchor.y + m(LINK_H / 2)),
            angle: body.getAngle(),
            linearDamping: 0.3,
            angularDamping: 0.8,
          });
          link.createFixture(Box(m(LINK_W / 2), m(LINK_H / 2)), { density: 6, filterMaskBits: 0 });
          world.createJoint(RevoluteJoint({}, prev, link, anchor));
          chain.push(link);
          prev = link;
          anchor = link.getWorldPoint(Vec2(0, m(LINK_H / 2)));
        }
        return prev;
      }

      /**
       * A slab hung under the lowest slab (or the mount) on two chains, hooked
       * on at `off` px to the side of where it was caught: two chains keep it
       * level, so its weight sits where you put it and shifts the whole
       * column's balance rather than spinning the slab.
       */
      function addSlab(off) {
        const parent = slabs.length ? slabs[slabs.length - 1].body : mount;
        const bottom = slabs.length ? SLAB_H / 2 : 8;
        const hx = [
          Math.max(-58, Math.min(58, off - HOOK)),
          Math.max(-58, Math.min(58, off + HOOK)),
        ];
        const links = hx.map((x) => addLinks(parent, Vec2(m(x), m(bottom))));
        const c = parent.getWorldPoint(Vec2(m(off), m(bottom + 2 * LINK_H + SLAB_H / 2)));
        const slab = world.createBody({
          type: "dynamic",
          position: c,
          angle: parent.getAngle(),
          linearDamping: 0.2,
          angularDamping: 0.5,
        });
        slab.createFixture(Box(m(SLAB_W / 2), m(SLAB_H / 2)), { density: 2.2, friction: 0.6 });
        links.forEach((link, k) => {
          const a = link.getWorldPoint(Vec2(0, m(LINK_H / 2)));
          world.createJoint(RevoluteJoint({}, link, slab, a));
        });
        slabs.push({ body: slab, off });
      }

      /** The tip: the lowest slab's bottom centre, where the next one hooks on. World px. */
      function tip() {
        const b = slabs[slabs.length - 1].body;
        const p = b.getWorldPoint(Vec2(0, m(SLAB_H / 2)));
        return { x: px(p.x), y: px(p.y), angle: b.getAngle() };
      }
      const stoneX = () => stone.x * (SHAFT - SLAB_W / 2);

      function tap() {
        if (over) return;
        const tp = tip();
        const rel = stoneX() - tp.x;
        if (Math.abs(rel) > SLAB_W * 0.85) {
          drag -= SUCK_MISS / STEP;
          flash("miss", "#c44");
          const last = slabs[slabs.length - 1].body;
          last.applyLinearImpulse(Vec2(Math.sign(rel || 1) * 2.5, 0), last.getWorldCenter(), true);
        } else {
          const perfect = Math.abs(rel) < 13;
          addSlab(perfect ? 0 : rel);
          drag += perfect ? 1 : STEP_OFF / STEP;
          flash(perfect ? "true" : "off " + Math.round(rel), perfect ? "#ffd27a" : "#caa");
          // The stone's momentum goes into the chain.
          const b = slabs[slabs.length - 1].body;
          b.applyLinearImpulse(Vec2(stone.dir * stone.speed * 1.2, 0), b.getWorldCenter(), true);
        }
        const fromLeft = Math.random() < 0.5;
        stone = {
          x: fromLeft ? -1 : 1,
          dir: fromLeft ? 1 : -1,
          speed: 1.05 + slabs.length * 0.025,
        };
      }

      /** A claw from a wall: shoves the nearest slab, lingers for a moment. */
      function claw(side = Math.random() < 0.5 ? -1 : 1) {
        if (over || slabs.length < 2) return;
        const i = Math.floor(Math.random() * slabs.length);
        const b = slabs[i].body,
          c = b.getWorldCenter();
        b.applyLinearImpulse(Vec2(-side * (1.6 + slabs.length * 0.12), 0.5), c, true);
        claws.push({ side, y: px(c.y), t: 0 });
        shake = 0.6;
      }
      /** A blow to the rock: the mount whips sideways and back. */
      function strike() {
        if (over) return;
        mount.setLinearVelocity(Vec2((Math.random() < 0.5 ? -1 : 1) * 4, 0));
        setTimeout(() => mount.setLinearVelocity(Vec2(-mount.getLinearVelocity().x, 0)), 120);
        setTimeout(() => mount.setLinearVelocity(Vec2(0, 0)), 240);
        shake = 1;
      }

      const floats = [];
      function flash(text, color) {
        floats.push({ text, color, t: 0 });
      }

      function step(dt) {
        time += dt;
        if (!over) {
          drag -= (SUCK_IDLE / STEP) * dt;
          stone.x += stone.dir * stone.speed * dt;
          if (stone.x > 1) {
            stone.x = 1;
            stone.dir = -1;
          } else if (stone.x < -1) {
            stone.x = -1;
            stone.dir = 1;
          }
          strikeT -= dt;
          clawT -= dt;
          if (!calm && clawT <= 0) {
            claw();
            clawT = 5 + Math.random() * 4;
          }
          if (!calm && strikeT <= 0) {
            strike();
            strikeT = 9 + Math.random() * 5;
          }
          // The mount sways back toward centre so strikes don't walk it off.
          if (Math.abs(mount.getLinearVelocity().x) < 0.01)
            mount.setPosition(Vec2(mount.getPosition().x * 0.9, 0));
          if (drag <= 0) {
            over = "hauled out";
          }
          if (drag >= SNAP) {
            over = "through";
            mount.setType("dynamic");
            mount.createFixture(Box(m(40), m(30)), { density: 8, filterGroupIndex: -1 });
          }
          if (bot) botStep();
        } else if (over === "through") fell += dt;
        drillY = (drag / SNAP) * 120; // how far the drill has entered the rock
        world.step(1 / 60, 12, 6);
        shake = Math.max(0, shake - dt * 2);
        for (const c of claws) c.t += dt;
        for (let i = claws.length - 1; i >= 0; i--) if (claws[i].t > 0.9) claws.splice(i, 1);
        for (const f of floats) f.t += dt;
        for (let i = floats.length - 1; i >= 0; i--) if (floats[i].t > 1) floats.splice(i, 1);
        const tp = tip();
        const want = Math.min(H * 0.3, H * 0.6 - tp.y - SLAB_H * 1.6);
        camY += (want - camY) * Math.min(1, dt * 3);
        hud();
      }

      function botStep() {
        const tp = tip();
        const rel = stoneX() - tp.x;
        // Catch when the stone is within `bot` px of the hook and moving toward it.
        if (Math.abs(rel) < bot && Math.sign(stone.dir) === Math.sign(tp.x - stoneX() || 1)) tap();
        else if (Math.abs(rel) < bot * 0.4) tap();
      }

      function hud() {
        document.getElementById("n").textContent = slabs.length;
        const r = document.getElementById("r");
        r.innerHTML = `drag <b>${Math.round((drag / SNAP) * 100)}%</b>${over ? " · " + over : ""}<br>${time.toFixed(1)} s`;
      }

      // ---------------------------------------------------------------- draw
      function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#0b0709";
        ctx.fillRect(0, 0, W, H);
        const ox = W / 2 + (shake > 0 ? Math.sin(time * 60) * shake * 7 : 0);
        const oy = camY;
        // Shaft walls.
        ctx.fillStyle = "#1a1210";
        ctx.fillRect(0, 0, ox - SHAFT - 40, H);
        ctx.fillRect(ox + SHAFT + 40, 0, W, H);
        ctx.fillStyle = "#2a1c17";
        ctx.fillRect(ox - SHAFT - 40, 0, 40, H);
        ctx.fillRect(ox + SHAFT, 0, 40, H);
        // The floor you're breaking toward.
        const floorY = oy + px(tip().y / PPM) + 70 + (1 - Math.min(1, drag / SNAP)) * 380;
        if (over !== "through") {
          ctx.fillStyle = "#3a2a22";
          ctx.fillRect(ox - SHAFT - 40, floorY, SHAFT * 2 + 80, 90);
          ctx.strokeStyle = `rgba(255,160,80,${0.2 + 0.6 * (drag / SNAP)})`;
          ctx.lineWidth = 1.5;
          const n = Math.floor((drag / SNAP) * 9);
          for (let i = 0; i < n; i++) {
            ctx.beginPath();
            ctx.moveTo(ox + Math.sin(i * 7.3) * SHAFT * 0.9, floorY);
            ctx.lineTo(
              ox + Math.sin(i * 7.3) * SHAFT * 0.9 + Math.sin(i * 3.1) * 30,
              floorY + 20 + i * 5,
            );
            ctx.stroke();
          }
        }
        // The opening and the drill in it: it sinks as drag grows.
        const mp = mount.getPosition();
        const dy = oy + px(mp.y) - 60 + (over === "through" ? 0 : 0);
        ctx.fillStyle = "#17100c";
        ctx.fillRect(ox - SHAFT - 40, -10, SHAFT * 2 + 80, oy - 40);
        ctx.fillStyle = "#5a4634";
        ctx.fillRect(ox + px(mp.x) - 60, dy - 80 + drillY * 0, 120, 100);
        ctx.fillStyle = "#8a6a46";
        ctx.fillRect(ox + px(mp.x) - 26, dy + 12, 52, 16);
        // The lip of rock it has entered: drawn over the drill, so it looks sunk in.
        ctx.fillStyle = "#2a1c17";
        ctx.fillRect(ox - SHAFT - 40, oy - 40 - drillY, SHAFT * 2 + 80, 20);
        ctx.fillStyle = "rgba(255,200,120,0.08)";
        ctx.fillRect(ox - SHAFT - 40, oy - 40 - drillY, SHAFT * 2 + 80, drillY + 2);
        // The god's grip: a band at the top of the chain; claws from the walls.
        const coat = Math.max(0, slabs.length * (SLAB_H + 2 * LINK_H) + 8 - drag * STEP);
        ctx.fillStyle = "rgba(60,20,90,0.35)";
        ctx.fillRect(ox - SHAFT, oy, SHAFT * 2, Math.max(0, coat));
        for (const c of claws) {
          const reach = Math.sin(Math.min(1, c.t / 0.9) * Math.PI) * 150;
          ctx.fillStyle = "#2b1838";
          ctx.beginPath();
          const x0 = ox + c.side * (SHAFT + 40);
          ctx.moveTo(x0, c.y - 30);
          ctx.lineTo(x0 - c.side * reach, c.y - 6);
          ctx.lineTo(x0 - c.side * reach * 0.8, c.y + 10);
          ctx.lineTo(x0, c.y + 30);
          ctx.fill();
        }
        // Chain links.
        ctx.strokeStyle = "#9a7a50";
        ctx.lineWidth = LINK_W;
        for (const l of chain) {
          const p = l.getPosition(),
            a = l.getAngle();
          ctx.save();
          ctx.translate(ox + px(p.x), oy + px(p.y));
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, -LINK_H / 2);
          ctx.lineTo(0, LINK_H / 2);
          ctx.stroke();
          ctx.fillStyle = "#c9a56a";
          ctx.fillRect(-4, LINK_H / 2 - 3, 8, 3);
          ctx.restore();
        }
        // Slabs: coated when within the god's grip.
        slabs.forEach((s, i) => {
          const p = s.body.getPosition(),
            a = s.body.getAngle();
          ctx.save();
          ctx.translate(ox + px(p.x), oy + px(p.y));
          ctx.rotate(a);
          const held = px(p.y) < coat;
          ctx.fillStyle = held ? "#3a2a4a" : i === slabs.length - 1 ? "#d9a060" : "#b07a48";
          ctx.fillRect(-SLAB_W / 2, -SLAB_H / 2, SLAB_W, SLAB_H);
          ctx.fillStyle = "rgba(0,0,0,0.25)";
          ctx.fillRect(-SLAB_W / 2, SLAB_H / 2 - 5, SLAB_W, 5);
          // Hook mark where the next slab will hang.
          ctx.fillStyle = "#ffd27a";
          ctx.fillRect(-2, SLAB_H / 2 - 6, 4, 6);
          ctx.restore();
        });
        // Sliding stone and the groove line from the hook.
        if (!over) {
          const tp = tip();
          const sy = oy + tp.y + 2 * LINK_H + 12;
          const sx = ox + stoneX();
          ctx.fillStyle = "#b07a48";
          ctx.fillRect(sx - SLAB_W / 2, sy, SLAB_W, SLAB_H);
          ctx.fillStyle = "#ffd27a";
          ctx.fillRect(sx - 2, sy, 4, 6);
          ctx.save();
          ctx.strokeStyle = "rgba(255,220,160,0.35)";
          ctx.setLineDash([4, 5]);
          ctx.beginPath();
          ctx.moveTo(ox + tp.x, oy + tp.y);
          ctx.lineTo(ox + tp.x, sy);
          ctx.stroke();
          ctx.restore();
        }
        // Floating words.
        ctx.font = "bold 22px system-ui";
        ctx.textAlign = "center";
        floats.forEach((f, i) => {
          ctx.globalAlpha = 1 - f.t;
          ctx.fillStyle = f.color;
          ctx.fillText(f.text, W / 2, H * 0.72 - f.t * 40 - i * 4);
        });
        ctx.globalAlpha = 1;
        if (over) {
          ctx.fillStyle = "#fff";
          ctx.font = "bold 34px system-ui";
          ctx.fillText(over === "through" ? "BROKEN THROUGH" : "HAULED OUT", W / 2, H * 0.4);
        }
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        step(dt);
        draw();
        requestAnimationFrame(frame);
      }
      addEventListener("pointerdown", (e) => {
        if (e.target === cv) tap();
      });
      document.querySelectorAll("#btns button").forEach((b) =>
        b.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          ({ c: claw, s: strike, r: reset })[b.dataset.k]();
        }),
      );
      addEventListener("keydown", (e) => {
        if (e.key === "c") claw();
        else if (e.key === "s") strike();
        else if (e.key === "r") reset();
        else if (e.key === " ") tap();
      });
      reset();
      requestAnimationFrame(frame);
      window.__chain = {
        tap,
        claw,
        strike,
        reset,
        get state() {
          return { slabs: slabs.length, drag, over, time };
        },
      };
    </script>
  </body>
</html>
