<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ring grey box</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0608;
        color: #e8dcc8;
        font:
          14px system-ui,
          sans-serif;
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
      }
      canvas {
        display: block;
        margin: 0 auto;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
      }
      #hud b {
        font-size: 28px;
      }
      #keys {
        position: fixed;
        bottom: 12px;
        left: 0;
        right: 0;
        text-align: center;
        opacity: 0.55;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div><b id="n">0</b>/<span id="goal">20</span> floors</div>
      <div id="r"></div>
    </div>
    <div id="keys">
      tap to drop · the wheel turns under your tower · R: restart · ?roll=0.3&amp;period=8
    </div>
    <script src="https://cdn.jsdelivr.net/npm/planck@1.5.0/dist/planck.min.js"></script>
    <script>
      // ---------------------------------------------------------------------
      // The Ring in grey boxes. Your tower stands on the rim of a vast wheel
      // that rolls back and forth beneath it. As it rolls, the tower is
      // carried sideways and leans with the rim (gravity turns with the
      // world); the crane above stays put. Tap to drop; the slab must land
      // before the next is offered. A true drop sets to what it lands on and
      // rides the roll as one; a loose slab slides and tips with it. The Dark
      // rises from below; the summit is the goal. Shapes only: judge control.
      // ---------------------------------------------------------------------
      const { World, Vec2, Box, WeldJoint } = planck;
      const params = new URLSearchParams(location.search);
      const PPM = 40;
      const W = 440,
        H = 956;
      const SLAB_W = 140,
        SLAB_H = 26;
      const WHEEL_R = 380;
      const ROLL = Number(params.get("roll") || 0.26);
      const PERIOD = Number(params.get("period") || 8);
      const GOAL = Number(params.get("goal") || 20);
      const SLIDE = 1.5; // half-spans per second
      const DARK_RATE = 11,
        DARK_PUSH = { perfect: 42, off: 12 },
        DARK_REACH = 8;
      const PERFECT = 12;
      const cv = document.getElementById("c");
      const dpr = Math.min(2, devicePixelRatio || 1);
      cv.width = W * dpr;
      cv.height = H * dpr;
      cv.style.width = W + "px";
      cv.style.height = H + "px";
      const ctx = cv.getContext("2d");
      const m = (p) => p / PPM,
        px = (q) => q * PPM;

      let world,
        rim,
        slabs,
        mover,
        falling,
        dark,
        time,
        over,
        floats,
        flash,
        shake,
        camY,
        phi,
        lost;
      function reset() {
        world = new World({ gravity: Vec2(0, 9.8) });
        rim = world.createBody({ type: "kinematic", position: Vec2(0, 0) });
        rim.createFixture(Box(m(SLAB_W * 1.4), m(10)), { friction: 1 });
        slabs = [];
        lost = 0;
        falling = null;
        dark = 170;
        time = 0;
        over = null;
        floats = [];
        flash = 0;
        shake = 0;
        camY = 0;
        phi = 0;
        spawn();
      }
      function towerTop() {
        if (slabs.length === 0) return { x: 0, y: -10, w: SLAB_W * 1.2, angle: 0 };
        const s = slabs[slabs.length - 1];
        const p = s.body.getPosition();
        return { x: px(p.x), y: px(p.y) - SLAB_H / 2, w: s.w, angle: s.body.getAngle() };
      }
      function spawn() {
        const t = towerTop();
        const dir = slabs.length % 2 ? -1 : 1;
        const w = slabs.length ? slabs[slabs.length - 1].w : SLAB_W;
        mover = { u: -dir, dir, w, y: t.y - SLAB_H * 3.2, center: t.x, half: SLAB_W * 0.9 };
      }
      function tap() {
        if (over || !mover) return;
        const t = towerTop();
        const x = mover.center + mover.u * mover.half;
        const err = x - t.x;
        const overlap = mover.w - Math.abs(err);
        if (overlap < 24) {
          floats.push({ t: "MISSED", c: "#c44", y: 0 });
          lost += 1;
          dark -= 30;
          shake = 0.6;
          if (lost >= 3) over = "fallen";
          return;
        }
        const perfect = Math.abs(err) < PERFECT;
        const w = perfect ? mover.w : overlap;
        const cx = perfect ? t.x : x - (Math.sign(err) * (mover.w - overlap)) / 2;
        const body = world.createBody({
          type: "dynamic",
          position: Vec2(m(cx), m(mover.y + SLAB_H / 2)),
          angle: t.angle,
          linearDamping: 0.1,
          angularDamping: 0.3,
          bullet: true,
        });
        body.createFixture(Box(m(w / 2), m(SLAB_H / 2)), { density: 1, friction: 0.7 });
        // It starts moving with the rim, so it lands where it was aimed.
        body.setLinearVelocity(Vec2(rim.getLinearVelocity().x, 0));
        falling = { body, w, perfect, age: 0 };
        mover = null;
      }
      /** The falling slab has come to rest on the tower: it counts; a true drop sets to what it landed on. */
      function land() {
        const f = falling;
        falling = null;
        const below = slabs.length ? slabs[slabs.length - 1].body : rim;
        if (f.perfect) world.createJoint(WeldJoint({}, below, f.body, f.body.getWorldCenter()));
        slabs.push({ body: f.body, w: f.w, perfect: f.perfect });
        dark += f.perfect ? DARK_PUSH.perfect : DARK_PUSH.off;
        if (f.perfect) floats.push({ t: "PERFECT", c: "#ffd27a", y: 0 });
        flash = f.perfect ? 0.3 : 0;
        if (slabs.length >= GOAL) over = "summit";
        else spawn();
      }

      function step(dt) {
        time += dt;
        if (!over) {
          const w = (Math.PI * 2) / PERIOD;
          phi = ROLL * Math.sin(time * w);
          const dphi = ROLL * w * Math.cos(time * w);
          rim.setLinearVelocity(Vec2(m(WHEEL_R * Math.cos(phi) * dphi), 0));
          rim.setAngularVelocity(-dphi);
          world.setGravity(Vec2(9.8 * Math.sin(phi), 9.8 * Math.cos(phi)));
          if (mover) {
            mover.u += mover.dir * SLIDE * dt;
            if (mover.u > 1) {
              mover.u = 1;
              mover.dir = -1;
            } else if (mover.u < -1) {
              mover.u = -1;
              mover.dir = 1;
            }
          }
          const t = towerTop();
          const height = -t.y;
          dark -= DARK_RATE * dt;
          dark = Math.min(dark, -height + SLAB_H * DARK_REACH); // never more than eight floors below the top
          if (dark <= -height + SLAB_H) over = "taken";
        }
        world.step(1 / 60, 10, 6);
        if (!over && falling) {
          falling.age += dt;
          const v = falling.body.getLinearVelocity();
          const rv = rim.getLinearVelocity();
          const rel = Math.hypot(v.x - rv.x, v.y);
          const p = falling.body.getPosition();
          if (px(p.y) > 200 || Math.abs(px(p.x)) > 600) {
            world.destroyBody(falling.body);
            falling = null;
            lost += 1;
            shake = 0.8;
            floats.push({ t: "FELL", c: "#c44", y: 0 });
            if (lost >= 3) over = "fallen";
            else spawn();
          } else if (
            (falling.age > 0.3 && rel < 0.2 && Math.abs(falling.body.getAngularVelocity()) < 0.4) ||
            falling.age > 2.5
          )
            land();
        }
        if (!over) {
          for (let i = slabs.length - 1; i >= 0; i--) {
            const p = slabs[i].body.getPosition();
            if (px(p.y) > 200 || Math.abs(px(p.x)) > 600) {
              world.destroyBody(slabs[i].body);
              slabs.splice(i, 1);
              lost += 1;
              shake = 0.8;
              floats.push({ t: "FELL", c: "#c44", y: 0 });
            }
          }
          if (lost >= 3) over = "fallen";
        }
        const t = towerTop();
        if (mover) mover.center += (t.x - mover.center) * Math.min(1, dt / 0.9);
        camY += (Math.min(0, t.y + 140) - camY) * Math.min(1, dt * 3);
        flash = Math.max(0, flash - dt);
        shake = Math.max(0, shake - dt * 2);
        for (const f of floats) f.y += dt;
        floats = floats.filter((f) => f.y < 1);
        document.getElementById("n").textContent = slabs.length;
        document.getElementById("r").innerHTML =
          `Dark <b>${Math.max(0, Math.round((dark - t.y) / SLAB_H))}</b> floors below${over ? " · " + over : ""}<br>${time.toFixed(1)} s`;
      }

      function slabRect(body, w, color) {
        const p = body.getPosition();
        ctx.save();
        ctx.translate(px(p.x), px(p.y));
        ctx.rotate(body.getAngle());
        ctx.fillStyle = color;
        ctx.fillRect(-w / 2, -SLAB_H / 2, w, SLAB_H);
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.fillRect(-w / 2, SLAB_H / 2 - 5, w, 5);
        ctx.restore();
      }
      function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#0b0709";
        ctx.fillRect(0, 0, W, H);
        const ox = W / 2 + (shake > 0 ? Math.sin(time * 60) * shake * 6 : 0);
        const oy = H * 0.62 - camY;
        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.moveTo(0, oy - 260);
        ctx.lineTo(W, oy - 260);
        ctx.stroke();
        ctx.save();
        ctx.translate(ox, oy);
        const rp = rim.getPosition();
        ctx.save();
        ctx.translate(px(rp.x), px(rp.y));
        ctx.rotate(rim.getAngle());
        ctx.strokeStyle = "#6b5236";
        ctx.lineWidth = 26;
        ctx.beginPath();
        ctx.arc(0, WHEEL_R + 13, WHEEL_R, -Math.PI / 2 - 0.9, -Math.PI / 2 + 0.9);
        ctx.stroke();
        ctx.strokeStyle = "rgba(0,0,0,0.5)";
        ctx.lineWidth = 2;
        for (let k = -8; k <= 8; k++) {
          const a = -Math.PI / 2 + k * 0.11;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * (WHEEL_R - 13), WHEEL_R + 13 + Math.sin(a) * (WHEEL_R - 13));
          ctx.lineTo(Math.cos(a) * (WHEEL_R + 13), WHEEL_R + 13 + Math.sin(a) * (WHEEL_R + 13));
          ctx.stroke();
        }
        ctx.fillStyle = "#8a6a46";
        ctx.fillRect(-SLAB_W * 1.4, -10, SLAB_W * 2.8, 20);
        ctx.restore();
        ctx.fillStyle = "rgba(40,20,60,0.85)";
        ctx.fillRect(-W, dark, W * 2, H * 2);
        ctx.strokeStyle = "rgba(170,110,255,0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-W, dark);
        ctx.lineTo(W, dark);
        ctx.stroke();
        for (const s of slabs) slabRect(s.body, s.w, s.perfect ? "#c9a56a" : "#b07a48");
        if (falling) slabRect(falling.body, falling.w, "#d9a060");
        const t = towerTop();
        if (!over && mover) {
          const x = mover.center + mover.u * mover.half,
            y = mover.y;
          ctx.fillStyle = "#d9a060";
          ctx.fillRect(x - mover.w / 2, y, mover.w, SLAB_H);
          ctx.strokeStyle = "rgba(255,220,160,0.3)";
          ctx.setLineDash([4, 5]);
          ctx.beginPath();
          ctx.moveTo(x, y + SLAB_H);
          ctx.lineTo(x, t.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.strokeStyle = "rgba(255,200,120,0.3)";
        ctx.setLineDash([6, 8]);
        ctx.beginPath();
        ctx.moveTo(-W, -GOAL * SLAB_H - 10);
        ctx.lineTo(W, -GOAL * SLAB_H - 10);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        if (flash > 0) {
          ctx.fillStyle = `rgba(255,230,190,${flash * 0.3})`;
          ctx.fillRect(0, 0, W, H);
        }
        ctx.font = "bold 22px system-ui";
        ctx.textAlign = "center";
        floats.forEach((f) => {
          ctx.globalAlpha = 1 - f.y;
          ctx.fillStyle = f.c;
          ctx.fillText(f.t, W / 2, oy + t.y - 60 - f.y * 30);
        });
        ctx.globalAlpha = 1;
        if (over) {
          ctx.fillStyle = "#fff";
          ctx.font = "bold 34px system-ui";
          ctx.fillText(
            over === "summit"
              ? "SUMMIT"
              : over === "taken"
                ? "TAKEN BY THE DARK"
                : "THE TOWER FELL",
            W / 2,
            H * 0.14,
          );
        }
      }
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        step(dt);
        draw();
        requestAnimationFrame(frame);
      }
      addEventListener("pointerdown", (e) => {
        if (e.target === cv) over ? reset() : tap();
      });
      addEventListener("keydown", (e) => {
        if (e.key === "r") reset();
        else if (e.key === " ") tap();
      });
      reset();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
